[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cli-usage-api"
version = "0.1.0"
description = "Immutable usage snapshots for a read-only terminal account dashboard"
requires-python = ">=3.11"
dependencies = ["textual", "httpx", "keyring", "starlette>=1.10.0", "uvicorn>=0.54.0"]

[project.scripts]
usage = "cli_usage_api.cli:main"
usage-keepalive = "cli_usage_api.keepalive:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_usage_api"]

[tool.hatch.build.targets.sdist]
include = ["src/cli_usage_api", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
