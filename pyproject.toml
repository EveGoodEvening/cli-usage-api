[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "cli-usage-api"
version = "0.1.0"
description = "Immutable usage snapshots for a read-only terminal account dashboard"
requires-python = ">=3.11"
dependencies = ["textual", "httpx", "keyring", "starlette>=1.10.0", "uvicorn>=0.54.0"]

[project.scripts]
usage = "cli_usage_api.cli:main"
usage-keepalive = "cli_usage_api.keepalive:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx", "ruff"]

[tool.uv]
require-build-hashes = true
# Only the pinned universal wheels are allowed, not sdists with additional build backends.
# Hatchling's tomli dependency applies only to Python <3.11, outside this project.
# editables is requested by Hatchling's editable-build hook, not a runtime dependency.
build-constraint-dependencies = [
    { requirement = "hatchling==1.33.0", hashes = ["sha256:415290b84f464d2884303fca8974d38e7b85579069fab02a15db0828fbb1446d"] },
    { requirement = "packaging==26.3", hashes = ["sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c"] },
    { requirement = "pathspec==1.1.1", hashes = ["sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189"] },
    { requirement = "pluggy==1.7.0", hashes = ["sha256:7dd7b0d8832ba3cb632c306926ded123429211b83641b35dc5c41ad2d34f9bec"] },
    { requirement = "tomlkit==0.15.2", hashes = ["sha256:05562412163a3037b94497385fb7f9204c637bc605af7a48199e41cf2272f437"] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = ["sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17"] },
    { requirement = "editables==0.6", hashes = ["sha256:d70e4698078a1d033e7786d9c64e5be070d058a67c21417024d38a58ac20aa43"] },
]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_usage_api"]

[tool.hatch.build.targets.sdist]
include = ["src/cli_usage_api", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
